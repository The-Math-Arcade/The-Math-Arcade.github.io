<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://cdn.jsdelivr.net/gh/hjamttes/hollow-knight@tree/main">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Hollow Knight</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #231F20;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

    </style>
</head>

<body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING... </div>
    <div hidden id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-mobile-warning"> WebGL builds are not supported on mobile devices. </div>
    </div>
    <script>
        var loadingText = document.querySelector("#loading-text");
        let totalBytes = 0;
        let loadedBytes = 0;
        function showLoadError(error) {
            loadingText.textContent = `Unable to load the game: ${error}. Check your connection and reload.`;
            loadingText.style.color = "#ff8a8a";
            loadingText.style.fontSize = "18px";
            console.error(error);
        }

        async function getSize(url) {
            try {
                const res = await fetch(url, {
                    method: "HEAD"
                });
                if (!res.ok) return 0;
                return parseInt(res.headers.get("Content-Length") || "0", 10);
            } catch {
                return 0;
            }
        }
        async function fetchWithProgress(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Asset request failed (${response.status}): ${url}`);
            const blob = await response.blob();
            loadedBytes += blob.size;
            const mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
            const mbTotal = totalBytes ? (totalBytes / (1024 * 1024)).toFixed(2) : "unknown";
            loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
            return blob;
        }
        async function mergeFiles(fileParts) {
            const blobs = new Array(fileParts.length);
            let nextIndex = 0;
            async function fetchNext() {
                while (nextIndex < fileParts.length) {
                    const index = nextIndex++;
                    blobs[index] = await fetchWithProgress(fileParts[index]);
                }
            }
            await Promise.all(Array.from({ length: Math.min(4, fileParts.length) }, fetchNext));
            const mergedBlob = new Blob(blobs);
            return URL.createObjectURL(mergedBlob);
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        (async () => {
            try {
                const allParts = [...getParts("Build/hk.data", 1, 42), ...getParts("Build/hk.wasm", 1, 2)];
                const sizes = await Promise.all(allParts.map(getSize));
                totalBytes = sizes.reduce((a, b) => a + b, 0);
                if (sizes.some(size => size === 0)) {
                    throw new Error("One or more game assets are unavailable from the asset host");
                }

                const [dataUrl, wasmurl] = await Promise.all([
                    mergeFiles(getParts("Build/hk.data", 1, 42)),
                    mergeFiles(getParts("Build/hk.wasm", 1, 2)),
                ]);
                const buildUrl = "Build";
                const loaderUrl = buildUrl + "/hk.loader.js";
                const config = {
                    dataUrl: dataUrl,
                    frameworkUrl: buildUrl + "/hk.framework.js",
                    codeUrl: wasmurl,
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "Team Cherry & Truffled",
                    productName: "Hollow Knight",
                    productVersion: "1.0",
                };
                const container = document.querySelector("#unity-container");
                container.hidden = false;
                const canvas = document.querySelector("#unity-canvas");
                const loadingBar = document.querySelector("#unity-loading-bar");
                const progressBarFull = document.querySelector("#unity-progress-bar-full");
                const mobileWarning = document.querySelector("#unity-mobile-warning");
                if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                    container.className = "unity-mobile";
                    config.devicePixelRatio = 1;
                    mobileWarning.style.display = "block";
                    setTimeout(() => { mobileWarning.style.display = "none"; }, 5000);
                } else {
                    function resizeCanvas() {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                        canvas.style.width = window.innerWidth + "px";
                        canvas.style.height = window.innerHeight + "px";
                    }
                    resizeCanvas();
                    window.addEventListener("resize", resizeCanvas);
                }
                loadingBar.style.display = "block";
                const script = document.createElement("script");
                script.src = loaderUrl;
                script.onerror = () => showLoadError(`Could not load Unity loader: ${loaderUrl}`);
                script.onload = () => {
                    createUnityInstance(canvas, config, progress => {
                        progressBarFull.style.width = 100 * progress + "%";
                    }).then(() => {
                        loadingText.remove();
                        loadingBar.style.display = "none";
                        canvas.style.display = "block";
                    }).catch(showLoadError);
                };
                document.body.appendChild(script);
            } catch (error) {
                showLoadError(error.message || error);
            }
        })();
    </script>
</body>

</html>
